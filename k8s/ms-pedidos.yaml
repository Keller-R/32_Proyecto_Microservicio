apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pedidos-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pedidos
  template:
    metadata:
      labels:
        app: ms-pedidos
    spec:
      containers:
      - name: ms-pedidos
        image: kellerr/ms-pedidos:v1 
        ports:
        - containerPort: 8082
        env:
        - name: SERVER_PORT
          value: "8082"
        # Esto es lo que permite que el pedido se comunique con el producto a traves de Kubernetes
        - name: PRODUCTOS_SERVICE_URL
          value: "http://ms-productos-service:80"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-pedidos-service
spec:
  selector:
    app: ms-pedidos
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8082
  type: LoadBalancer
