apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pedidos-deployment
  namespace: ms-pedidos-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ms-pedidos
  template:
    metadata:
      labels:
        app: ms-pedidos
    spec:
      containers:
      - name: ms-pedidos
        image: kellerr/ms-pedidos:v1
        ports:
        - containerPort: 8082
        env:
        - name: SERVER_PORT
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: SERVER_PORT
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: DB_NAME
        - name: DB_SSL_MODE
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: DB_SSL_MODE
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: DB_PASSWORD
        - name: PRODUCTOS_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: ms-pedidos-secret
              key: PRODUCTOS_SERVICE_URL
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8082
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 15
